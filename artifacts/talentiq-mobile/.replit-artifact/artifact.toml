kind = "mobile"
previewPath = "/"
title = "TalentIQ AI"
description = "A premium mobile hiring platform for candidates and recruiters, with job discovery, AI match insights, smart assessments, application tracking, and a recruiter pipeline."
version = "1.0.0"
id = "artifacts/talentiq-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23309

[services.development]
run = "pnpm --filter @workspace/talentiq-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talentiq-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/talentiq-mobile", "run", "serve" ]

[services.env]
PORT = "23309"
BASE_PATH = "/"
